<!--title:Your account | CardioViz-->
<!--desc:Log in or create an account to save CardioViz predictions and review your history.-->
<!--crumb:Account-->
<section><div class="wrap">
<h1 style="max-width:none">Your account</h1>
<div id="in" hidden>
 <div class="grid">
  <form class="contact" id="fl" data-a="login"><h2>Log in</h2>
   <label>Email<input name="email" type="email" required autocomplete="email"></label>
   <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
   <button class="btn" type="submit">Log in</button></form>
  <form class="contact" id="fr" data-a="register"><h2>Create account</h2>
   <label>Name<input name="name" required minlength="2" autocomplete="name"></label>
   <label>Email<input name="email" type="email" required autocomplete="email"></label>
   <label>Password (8+ characters)<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
   <label class="check"><input type="checkbox" name="consent" required> I agree to the <a href="/terms">terms</a> and the <a href="/privacy">privacy policy</a>. Predictions are stored only when I press Save.</label>
   <button class="btn" type="submit">Create account</button></form>
 </div>
 <form class="contact" id="ff" style="margin-top:1.5rem"><h2>Forgot your password, or no verification code?</h2>
  <label>Email<input name="email" type="email" required autocomplete="email"></label>
  <div><button class="btn small" data-a="forgot" type="submit">Email me a reset code</button> <button class="btn small ghost" data-a="resend" type="submit">Resend verification code</button></div></form>
</div>
<form class="contact" id="fc" hidden><h2 id="fc-t"></h2>
 <p>We emailed a 6-digit code to <strong id="fc-e"></strong>. It works for 10 minutes.</p>
 <label>6-digit code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label>
 <label id="fpw" hidden>New password (8+ characters)<input name="password" type="password" minlength="8" autocomplete="new-password"></label>
 <button class="btn" type="submit">Confirm</button> <button class="link" type="button" id="fn">Send a new code</button></form>
<div id="out" hidden>
 <p>Signed in as <strong id="who"></strong>. <button class="link" id="lo">Log out</button></p>
 <h2>Saved predictions</h2>
 <p id="none">Nothing saved yet. Open the <a href="%DEMO%">demo</a> and press Save this prediction.</p>
 <div style="overflow-x:auto"><table><thead><tr><th>Saved</th><th>CAD</th><th>LAD</th><th>LCX</th><th>RCA</th><th></th></tr></thead><tbody id="hist"></tbody></table></div>
 <p><button class="btn ghost small" id="da">Delete my account and all saved data</button></p>
</div>
<div id="am" class="msg" role="status"></div>
</div></section>
<script>
(()=>{const $=id=>document.getElementById(id),say=(t,c)=>{const m=$('am');m.className='msg '+c;m.textContent=t},
j=async(u,o,m)=>{const r=await fetch(u,o!==undefined||m?{method:m||'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o||{})}:undefined);return{ok:r.ok,d:await r.json().catch(()=>({}))}};
let mode='',em='';
function step(m,e){mode=m;em=e;$('fc').hidden=false;$('in').hidden=true;$('fc-e').textContent=e;$('fc-t').textContent=m==='reset'?'Reset your password':'Verify your email';$('fpw').hidden=m!=='reset';$('fpw').querySelector('input').required=m==='reset';$('fc').querySelector('[name=code]').focus()}
async function load(){const{d}=await j('/api/auth?a=me');$('fc').hidden=true;$('in').hidden=!!d.user;$('out').hidden=!d.user;if(!d.user)return;
 $('who').textContent=d.user.name+' ('+d.user.email+')';const h=await j('/api/predictions'),rows=h.d.items||[];$('hist').innerHTML='';
 rows.forEach(r=>{const tr=document.createElement('tr'),p=r.probs||{};tr.innerHTML='<td></td>'+['CAD','LAD','LCX','RCA'].map(t=>'<td>'+Math.round((+p[t]||0)*100)+'%</td>').join('')+'<td><button class="link">Delete</button></td>';
  tr.firstChild.textContent=new Date(r.created_at).toLocaleString();tr.querySelector('button').onclick=async()=>{if(confirm('Delete this saved prediction?')){await j('/api/predictions?id='+r.id,{},'DELETE');load()}};$('hist').appendChild(tr)});$('none').hidden=rows.length>0}
for(const f of [$('fl'),$('fr')])f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.consent=!!d.consent;const r=await j('/api/auth?a='+f.dataset.a,d);
 if(!r.ok)return say(r.d.error||'Something went wrong.','err');f.reset();if(r.d.verify){say('Account created. Enter the code we emailed you.','ok');step('verify',d.email.trim().toLowerCase())}else{say('','');load()}};
$('ff').onsubmit=async e=>{e.preventDefault();const a=e.submitter.dataset.a,d=Object.fromEntries(new FormData($('ff'))),r=await j('/api/auth?a='+a,d);
 if(!r.ok)return say(r.d.error||'Something went wrong.','err');say('If that email has an account, we sent a code. Check your inbox and spam folder.','ok');step(a==='forgot'?'reset':'verify',d.email.trim().toLowerCase())};
$('fc').onsubmit=async e=>{e.preventDefault();const d={email:em,code:$('fc').code.value.trim()};if(mode==='reset')d.password=$('fc').password.value;
 const r=await j('/api/auth?a='+(mode==='reset'?'reset':'verify'),d);if(!r.ok)return say(r.d.error||'Something went wrong.','err');$('fc').reset();
 if(mode==='reset'){say('Password changed. Log in with your new password.','ok');load()}else{say('Email verified. You are logged in.','ok');load()}};
$('fn').onclick=async()=>{const r=await j('/api/auth?a='+(mode==='reset'?'forgot':'resend'),{email:em});say(r.ok?'A new code was sent if the account exists.':r.d.error,r.ok?'ok':'err')};
$('lo').onclick=async()=>{await j('/api/auth?a=logout',{});load()};
$('da').onclick=async()=>{if(confirm('Delete your account and every saved prediction? This cannot be undone.')){await j('/api/auth?a=delete',{});say('Your account and data were deleted.','ok');load()}};
load()})();
</script>
