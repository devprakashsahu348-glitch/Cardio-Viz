<!--title:Forgot password | CardioViz-->
<!--desc:Request a link to reset your CardioViz password.-->
<!--crumb:Forgot password-->
<section class="auth"><div class="authcard">
<h1>Forgot your password?</h1><p class="sub">Enter your registered email and we will send you a reset link.</p>
<div id="msg" class="msg" role="status" aria-live="polite"></div>
<form class="contact" data-form="forgot" novalidate>
<label>Email address<input name="email" type="email" required autocomplete="email"></label>
<button class="btn" type="submit">Send reset link</button></form>
<p class="alt"><a href="/login">Back to log in</a></p></div></section>
<script src="/auth.js?v=%BUILD%" defer></script>
